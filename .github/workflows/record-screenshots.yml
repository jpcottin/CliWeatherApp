name: Record Screenshots (temporary)

# One-off helper: regenerates the Compose preview golden images on the CI
# runner so they match the environment that validates them, then uploads them
# as an artifact to commit. Removed once the goldens are recorded.
on:
  workflow_dispatch:

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Record golden screenshots
      run: ./gradlew :app:updateDebugScreenshotTest

    - name: Upload generated reference images
      uses: actions/upload-artifact@v4
      with:
        name: screenshot-references
        path: app/src/screenshotTestDebug/reference/
